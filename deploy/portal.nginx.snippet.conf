# ============================================================
#  Portal —— Nginx 接入片段 (最小冲击版)
#  域名:   ecx.fuxi.space
#  端口:   14100  (你已有 listen 配置，此处不动)
#  HTTPS:  你已有 ssl_certificate 等，此处不动
#
# 用法: 把下面两段 location {} 直接粘贴到你现有 server {} 花括号里
#       （和已有的 listen / listen ssl / server_name / ssl_certificate 同级）
# ============================================================

# ------ 1. 前端静态 + SPA 回退 ------
# root 指向 Vue 构建产物 dist 目录
root /opt/portal/web/dist;
index index.html;

location / {
    # 单页应用: 刷新子路由不 404
    try_files $uri $uri/ /index.html;

    # 带 hash 的构建产物强缓存 (30 天 + immutable)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}

# ------ 2. 后端 API 反代 ------
# 后端由 PM2 守护，监听 3001
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
}

# ------ 3. 可选: 健康检查 (给监控脚本用) ------
# location = /api/health {
#     proxy_pass http://127.0.0.1:3001/api/health;
# }
