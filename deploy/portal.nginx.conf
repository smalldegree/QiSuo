# ============================================================
# 系统入口 Portal —— Nginx 配置
# Ubuntu 24.04 / nginx 1.24+
# 部署路径假设: /opt/portal/web/dist  (前端静态)
#              /opt/portal/server      (后端代码)
# 后端端口:    3001
# ============================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;   # 你的域名或服务器IP; 本地部署保持 _ 即可

    # ---------- 前端静态 ----------
    root /opt/portal/web/dist;
    index index.html;

    # 单页应用: 所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源强缓存
        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------- 后端 API 反代 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ---------- 健康检查 (可选) ----------
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
